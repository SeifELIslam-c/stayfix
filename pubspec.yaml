name: hotel_lux_os
description: "Stayfix Management System"
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Icons ---
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  lottie: ^3.1.0               
  google_fonts: ^6.2.1         
  flutter_animate: ^4.5.0      
  flutter_svg: ^2.0.10+1

  # --- State Management ---
  provider: ^6.1.2

  # --- Storage & Networking ---
  shared_preferences: ^2.5.5
  http: ^1.2.1
  http_parser: ^4.1.2
  mime: ^2.0.0
  syncfusion_flutter_pdfviewer: ^27.1.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  record: ^6.1.1
  url_launcher: ^6.3.1

  # --- Firebase (Backend) ---
  firebase_core: ^3.1.0        
  firebase_auth: ^5.1.0        
  cloud_firestore: ^5.0.1      
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.2
  change_app_package_name: ^1.5.0
  local_auth: ^3.0.1
  google_sign_in: ^6.2.2
  country_picker: ^2.0.27

dependency_overrides:
  lucide_icons:
    path: packages/lucide_icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/stayfix.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icons/stayfix.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/authheroimg.webp
    - assets/conduheroimg.webp
    - assets/devbackground.webp
    - assets/interventfilterheroimg.webp
    - assets/selectionheroimg.webp
    - assets/termsheroimg.webp
    - assets/stayfix_chat_background_dark_doodle.webp
    - assets/google-icon-logo-svgrepo-com.svg
    - assets/lottie/
    - assets/icons/stayfix.webp
